# Prices in USD per 1,000,000 tokens. Checked 2026-11-15 against public pricing
# pages; verify before trusting cost figures for a real decision, since provider
# prices change without notice (see PRD risk: "Prices change").
#
# ollama is not listed: local models always cost $0, handled in evalh/pricing.py.
openai:
  gpt-5:
    input_per_1m: 1.25
    output_per_1m: 10.00
  gpt-5-mini:
    input_per_1m: 0.25
    output_per_1m: 2.00

# Base (non-cached) input/output rates from https://platform.claude.com/docs/en/about-claude/pricing,
# checked 2026-11-15. Prompt caching isn't used by this harness, so cache
# write/read rates aren't tracked here.
anthropic:
  claude-opus-5:
    input_per_1m: 5.00
    output_per_1m: 25.00
  claude-haiku-4-5-20251001:
    input_per_1m: 1.00
    output_per_1m: 5.00
