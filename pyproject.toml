[project]
name = "evalh"
version = "0.1.0"
description = "LLM Eval Harness: compare LLM configurations on a labelled dataset for accuracy, cost and latency"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.38",
    "plotly>=5.23",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
evalh = "evalh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalh"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
